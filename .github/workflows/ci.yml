name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 显式 auto：覆盖 setup-go v7 强制的 GOTOOLCHAIN=local ⇒ 将来 go.mod 的
      # toolchain 地板再抬时，Go 能自动拉取而不是构建失败（2026-10-26 实测：
      # 浮动 go-version 拿到低于地板的 patch ⇒ 直接构建失败，门禁变噪声）。
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "1.26.10" }
      - name: Install IDL toolchain
        run: ./scripts/install-tools.sh
      - name: Gen check (model ↔ idl 同步)
        run: CHECK=1 ./scripts/gen-model.sh
      - name: Gen check (openapi ↔ idl 同步)
        run: go run ./cmd/gen-openapi --check
      - name: Gen check (ts ↔ idl 同步)
        run: go run ./cmd/gen-ts --check
      - name: Build
        run: go build ./...
      # gofmt 门禁（2026-10-22 补）：此前 core/server/p2p/contracts 四个 Go 仓的
      # CI 都没有 gofmt 步，.golangci.yml 也没开 gofmt linter —— 格式漂移无人拦
      # （core 仓 HEAD 上就压着 19 个漂移文件）。**发现即红，修法是 gofmt -w**，
      # 不设豁免：豁免即免死金牌（与前端 api-body-types-check 门禁同族教训）。
      - name: Gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

      # 依赖漏洞门禁（govulncheck）：可达漏洞即红；修复策略=升依赖地板，不许注释绕过
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Dep guard(contracts 零项目内依赖)
        run: |
          BAD=$(go list -deps ./... | grep -E '^github.com/pigeonbox/' | grep -Ev '^github.com/pigeonbox/contracts(/|$)' || true)
          if [ -n "$BAD" ]; then echo "✗ contracts 违规依赖:"; echo "$BAD"; exit 1; fi
          echo "✓ 依赖方向合规"
