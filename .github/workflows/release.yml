name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  types-tgz:
    # gen/ts 的 npm tgz 随 tag 发布到 Release——前端以 Release 资产 URL 直接
    # 依赖(匿名 https,Docker/CI 构建免 git 免 registry,版本钉定与 tag 对齐)
    #
    # 发布前置门(issue #30):三道生成链 check 与 ci.yml 同款——打 tag 即打包前
    # 必须先证明 gen/、openapi.json、gen/ts 与 idl/ 同步;版本改**断言**
    # (不一致即红),不再用 --allow-same-version 静默改写掩盖「改了 IDL 忘抬
    # package.json」。
    runs-on: ubuntu-latest
    env:
      # 与 ci.yml 同口径:显式 auto 覆盖 setup-go 强制的 GOTOOLCHAIN=local
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: 版本断言(package.json.version == tag,不一致即红)
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::package.json version ($pkg) != tag ($tag)——库线内容一变先抬版本再打 tag"
            exit 1
          fi
          echo "✓ 版本一致: $pkg"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "1.26.11" }
      - name: Install IDL toolchain
        run: ./scripts/install-tools.sh
      - name: Gen check (model ↔ idl 同步)
        run: CHECK=1 ./scripts/gen-model.sh
      - name: Gen check (openapi ↔ idl 同步)
        run: go run ./cmd/gen-openapi --check
      - name: Gen check (ts ↔ idl 同步)
        run: go run ./cmd/gen-ts --check
      - name: Pack TS 类型包
        run: npm pack --pack-destination .
      - name: Upload to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: pigeonbox-contracts-*.tgz
