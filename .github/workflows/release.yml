name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  types-tgz:
    # gen/ts 的 npm tgz 随 tag 发布到 Release——前端以 Release 资产 URL 直接
    # 依赖(匿名 https,Docker/CI 构建免 git 免 registry,版本钉定与 tag 对齐)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: 版本对齐(package.json.version ← tag)
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --no-workspaces-update
      - name: Pack TS 类型包
        run: npm pack --pack-destination .
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: pigeonbox-contracts-*.tgz
